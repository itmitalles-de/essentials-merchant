name: essentials-merchant-amazon

services:
  db:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    environment:
      POSTGRES_USER: erplite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: erplite
    volumes:
      - erplite_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erplite -d erplite"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  backend:
    image: essentials-merchant-backend:${MERCHANT_GIT_SHA:?MERCHANT_GIT_SHA must be the full live commit}
    build:
      context: ./backend
      labels:
        org.opencontainers.image.revision: ${MERCHANT_GIT_SHA:?MERCHANT_GIT_SHA must be set}
        org.opencontainers.image.source: https://github.com/itmitalles-de/essentials-merchant
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://erplite:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/erplite
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      INTEGRATION_SECRET: ${INTEGRATION_SECRET:?INTEGRATION_SECRET must be set}
      INTEGRATION_KEY_ID: mantle-amazon
      PDF_STORAGE_DIR: /data/invoices
      ESSENTIALS_MODULE_PROFILE: amazon-read-only
      MANTLE_PILOT_NO_LOGIN: ${MANTLE_PILOT_NO_LOGIN:-true}
      PILOT_SECRETS_KEY: ${PILOT_SECRETS_KEY:?PILOT_SECRETS_KEY must be set}
      MARKETPLACE_WORKER_INTERVAL_SECONDS: ${MARKETPLACE_WORKER_INTERVAL_SECONDS:-5}
      AMAZON_STAGING_APPROVAL: ${AMAZON_STAGING_APPROVAL:-}
      AMAZON_SECRET_PILOT_SELLER: ${AMAZON_SECRET_PILOT_SELLER:-}
      OPENAI_STRATEGY_ENABLED: ${OPENAI_STRATEGY_ENABLED:-true}
      OPENAI_STRATEGY_MODEL: ${OPENAI_STRATEGY_MODEL:-gpt-5.6}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RUST_LOG: ${RUST_LOG:-info}
      APP_ENV: production
    volumes:
      - erplite_invoices:/data/invoices
    healthcheck:
      test: ["CMD", "/app/server", "--healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  frontend:
    image: essentials-merchant-frontend:${MERCHANT_GIT_SHA:?MERCHANT_GIT_SHA must be the full live commit}
    build:
      context: ./frontend
      labels:
        org.opencontainers.image.revision: ${MERCHANT_GIT_SHA:?MERCHANT_GIT_SHA must be set}
        org.opencontainers.image.source: https://github.com/itmitalles-de/essentials-merchant
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MANTLE_AMAZON_FRONTEND_PORT:-18090}:80"
    networks:
      default:
      proxy_net:
        aliases:
          - ${MANTLE_AMAZON_PROXY_ALIAS:-essentials-merchant-amazon-frontend}

volumes:
  erplite_db_data:
  erplite_invoices:

networks:
  default:
  proxy_net:
    external: true
    name: proxy_net
