name: essentials-merchant-amazon-pilot

services:
  db:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    environment:
      POSTGRES_USER: erplite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: erplite
    volumes:
      - erplite_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erplite -d erplite"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://erplite:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/erplite
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      INTEGRATION_SECRET: ${INTEGRATION_SECRET:?INTEGRATION_SECRET must be set}
      INTEGRATION_KEY_ID: pilot
      PDF_STORAGE_DIR: /data/invoices
      ESSENTIALS_MODULE_PROFILE: amazon-read-only
      MARKETPLACE_WORKER_INTERVAL_SECONDS: ${MARKETPLACE_WORKER_INTERVAL_SECONDS:-1}
      AMAZON_STAGING_APPROVAL: ${AMAZON_STAGING_APPROVAL:-}
      AMAZON_SECRET_PILOT_SELLER: ${AMAZON_SECRET_PILOT_SELLER:-}
      OPENAI_STRATEGY_ENABLED: ${OPENAI_STRATEGY_ENABLED:-false}
      OPENAI_STRATEGY_MODEL: ${OPENAI_STRATEGY_MODEL:-gpt-5.6}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RUST_LOG: ${RUST_LOG:-info}
      APP_ENV: pilot
    volumes:
      - erplite_invoices:/data/invoices
    healthcheck:
      test: ["CMD", "/app/server", "--healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PILOT_FRONTEND_PORT:-8090}:80"

volumes:
  erplite_db_data:
  erplite_invoices:
