[workspace]
resolver = "2"
members = ["crates/domain", "crates/db", "crates/pdf", "crates/server"]

[workspace.package]
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
rust_decimal = { version = "1", default-features = false, features = ["serde", "std"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "uuid", "rust_decimal", "migrate", "macros", "json"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
argon2 = { version = "0.5", features = ["password-hash"] }
jsonwebtoken = "9"
async-trait = "0.1"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
ring = "0.17"
zeroize = "1"

domain = { path = "crates/domain" }
db = { path = "crates/db" }
pdf = { path = "crates/pdf" }
