name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: erplite
          POSTGRES_PASSWORD: erplite
          POSTGRES_DB: erplite
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erplite"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://erplite:erplite@localhost:5432/erplite
      SQLX_OFFLINE: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Format check
        working-directory: backend
        run: cargo fmt --check

      - name: Clippy
        working-directory: backend
        run: cargo clippy --all-targets -- -D warnings

      - name: Install Typst for PDF tests
        env:
          TYPST_VERSION: '0.12.0'
        run: |
          curl -fsSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" -o /tmp/typst.tar.xz
          tar -xJf /tmp/typst.tar.xz -C /tmp
          sudo install "/tmp/typst-x86_64-unknown-linux-musl/typst" /usr/local/bin/typst

      - name: Test
        working-directory: backend
        run: cargo test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - working-directory: frontend
        run: npm ci

      - name: Typecheck + build
        working-directory: frontend
        run: npm run build

      - name: Lint
        working-directory: frontend
        run: npm run lint

  commerce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: commerce/package-lock.json

      - working-directory: commerce
        run: npm ci

      - name: Typecheck and lint
        working-directory: commerce
        run: npm run lint

      - name: Test integration helpers
        working-directory: commerce
        run: npm test

      - name: Build Vendure, Dashboard, and Storefront
        working-directory: commerce
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_PASSWORD: ci-placeholder
      JWT_SECRET: ci-placeholder
      ADMIN_PASSWORD: ci-placeholder
      INTEGRATION_SECRET: ci-placeholder
      VENDURE_DB_PASSWORD: ci-placeholder
      VENDURE_COOKIE_SECRET: ci-placeholder
      VENDURE_SUPERADMIN_USERNAME: ci-superadmin
      VENDURE_SUPERADMIN_PASSWORD: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build all compose images
        run: docker compose build

      - name: Start complete stack
        run: |
          if ! docker network inspect proxy_net >/dev/null 2>&1; then
            docker network create proxy_net
          fi
          docker compose up -d --wait

      - name: Run vertical commerce test
        working-directory: commerce
        env:
          CORE_API_URL: http://localhost:8090/api
          STOREFRONT_API_URL: http://localhost:3001/api/shop
          CORE_ADMIN_USERNAME: admin
          CORE_ADMIN_PASSWORD: ci-placeholder
        run: npm run test:vertical

      - name: Print service logs after failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop test stack
        if: always()
        run: docker compose down --volumes
