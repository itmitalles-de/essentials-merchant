log_format privacy_safe '$remote_addr [$time_local] '
                        '"$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent';

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log privacy_safe;
    root /usr/share/nginx/html;
    index index.html;

    # A weekly run performs two bounded provider calls in sequence. Keep the
    # longer timeout scoped to this exact read-only action; all other API
    # routes retain nginx's default upstream timeout.
    location = /api/marketplace/strategy/weekly {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Mantle-Pilot-Proxy "v1";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 270s;
    }

    location /api/ {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The backend issues the anonymous Mantle pilot session only through
        # this dedicated same-origin frontend proxy. Incoming client values are
        # overwritten here and are therefore not trusted directly.
        proxy_set_header X-Mantle-Pilot-Proxy "v1";
    }

    location / {
        try_files $uri /index.html;
    }
}
