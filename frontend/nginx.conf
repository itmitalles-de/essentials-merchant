server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The backend issues the anonymous Mantle pilot session only through
        # this dedicated same-origin frontend proxy. Incoming client values are
        # overwritten here and are therefore not trusted directly.
        proxy_set_header X-Mantle-Pilot-Proxy "v1";
    }

    location / {
        try_files $uri /index.html;
    }
}
